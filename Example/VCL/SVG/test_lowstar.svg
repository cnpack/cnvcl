<?xml version="1.0" encoding="UTF-8"?>
<!--
  CnSVG "low-effort gap" regression case.
  Render this file TWICE with Example/VCL/SVG/SVGDemo:
    1) with the current CnSVG.pas  -> see the PROBLEM
    2) after the fix                -> see the RESULT
  Each section states the expected result. All text is ASCII.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="900" height="1180" viewBox="0 0 900 1180">

  <defs>
    <!-- Section 3 -->
    <clipPath id="clipBBox" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.45"/>
    </clipPath>
    <clipPath id="clipUser">
      <ellipse cx="420" cy="525" rx="92" ry="58"/>
    </clipPath>
    <clipPath id="clipEvenOdd">
      <path clip-rule="evenodd"
            d="M 600 460 H 800 V 590 H 600 Z M 640 490 H 760 V 560 H 640 Z"/>
    </clipPath>

    <!-- Section 5: gDerived inherits stops from gBase via xlink:href -->
    <linearGradient id="gBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e74c3c"/>
      <stop offset="1" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="gDerived" xlink:href="#gBase"
                    x1="0" y1="0" x2="0" y2="1"/>
    <!-- reference: vertical gradient with explicit stops -->
    <linearGradient id="gVertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e74c3c"/>
      <stop offset="1" stop-color="#2980b9"/>
    </linearGradient>

    <!-- Section 6 -->
    <solidColor id="sc" solid-color="#27ae60" solid-opacity="0.5"/>
  </defs>

  <rect x="0" y="0" width="900" height="1180" fill="white"/>
  <text x="24" y="34" font-size="21" font-weight="bold" fill="#222222">CnSVG low-effort gap test - render BEFORE and AFTER the fix</text>

  <!-- ============ 1. stroke-dashoffset ============ -->
  <text x="24" y="76" font-size="15" fill="#333333">1. stroke-dashoffset : offset=16 / 90 must SHIFT the dash pattern</text>
  <line x1="40" y1="110" x2="420" y2="110" stroke="#c0392b"
        stroke-width="8" stroke-dasharray="20 12" stroke-dashoffset="0"/>
  <line x1="40" y1="150" x2="420" y2="150" stroke="#c0392b"
        stroke-width="8" stroke-dasharray="20 12" stroke-dashoffset="16"/>
  <text x="40" y="180" font-size="12" fill="#666666">offset 0 (top) / offset 16 (bottom)</text>
  <circle cx="560" cy="130" r="42" fill="none" stroke="#2c3e50"
          stroke-width="12" stroke-dasharray="180 90" stroke-dashoffset="0"/>
  <circle cx="720" cy="130" r="42" fill="none" stroke="#2c3e50"
          stroke-width="12" stroke-dasharray="180 90" stroke-dashoffset="90"/>
  <text x="520" y="190" font-size="12" fill="#666666">ring offset 0</text>
  <text x="680" y="190" font-size="12" fill="#666666">ring offset 90</text>
  <text x="24" y="205" font-size="12" fill="#aa0000">CURRENT: both lines / both rings identical. EXPECTED: shifted.</text>

  <!-- ============ 2. color formats ============ -->
  <text x="24" y="240" font-size="15" fill="#333333">2. color syntax : rgba / hsl / hsla / transparent / named colors</text>
  <rect x="40"  y="256" width="120" height="90" fill="#00a0ff"/>
  <rect x="48"  y="264" width="104" height="74" fill="rgba(255,0,0,0.5)"/>
  <rect x="180" y="256" width="120" height="90" fill="#00a0ff"/>
  <rect x="188" y="264" width="104" height="74" fill="hsl(120,100%,50%)"/>
  <rect x="320" y="256" width="120" height="90" fill="#00a0ff"/>
  <rect x="328" y="264" width="104" height="74" fill="hsla(240,100%,50%,0.5)"/>
  <rect x="460" y="256" width="120" height="90" fill="#00a0ff"/>
  <rect x="468" y="264" width="104" height="74" fill="transparent"/>
  <rect x="600" y="256" width="120" height="90" fill="#00a0ff"/>
  <rect x="608" y="264" width="104" height="74" fill="rebeccapurple"/>
  <rect x="740" y="256" width="120" height="90" fill="#00a0ff"/>
  <rect x="748" y="264" width="104" height="74" fill="lightgoldenrodyellow"/>
  <text x="40"  y="366" font-size="11" fill="#333333">rgba(255,0,0,.5)</text>
  <text x="180" y="366" font-size="11" fill="#333333">hsl(120,100%,50%)</text>
  <text x="320" y="366" font-size="11" fill="#333333">hsla(240,..,.5)</text>
  <text x="460" y="366" font-size="11" fill="#333333">transparent</text>
  <text x="600" y="366" font-size="11" fill="#333333">rebeccapurple</text>
  <text x="740" y="366" font-size="11" fill="#333333">lightgoldenrod</text>
  <text x="24" y="392" font-size="12" fill="#aa0000">CURRENT: all six inner boxes BLACK. EXPECTED: translucent red, green, translucent blue, BLUE (fully transparent), purple, pale yellow.</text>

  <!-- ============ 3. clipPathUnits / clip-rule ============ -->
  <text x="24" y="436" font-size="15" fill="#333333">3. clipPathUnits=objectBoundingBox and clip-rule=evenodd</text>
  <rect x="40"  y="460" width="200" height="130" fill="#e74c3c"
        clip-path="url(#clipBBox)"/>
  <rect x="320" y="460" width="200" height="130" fill="#27ae60"
        clip-path="url(#clipUser)"/>
  <rect x="600" y="460" width="200" height="130" fill="#2980b9"
        clip-path="url(#clipEvenOdd)"/>
  <text x="40"  y="612" font-size="12" fill="#666666">bbox circle (0..1)</text>
  <text x="320" y="612" font-size="12" fill="#666666">userSpace ellipse (reference)</text>
  <text x="600" y="612" font-size="12" fill="#666666">clip-rule=evenodd (hole)</text>
  <text x="24" y="632" font-size="12" fill="#aa0000">CURRENT: left shape nearly INVISIBLE, right shape has NO hole; middle is correct reference.</text>

  <!-- ============ 4. paint-order ============ -->
  <text x="24" y="666" font-size="15" fill="#333333">4. paint-order=stroke fill (SVG 2)</text>
  <circle cx="180" cy="736" r="48" fill="#e74c3c" stroke="#2c3e50" stroke-width="18"/>
  <circle cx="480" cy="736" r="48" fill="#e74c3c" stroke="#2c3e50"
          stroke-width="18" paint-order="stroke fill"/>
  <text x="80"  y="800" font-size="12" fill="#666666">default : fill then stroke</text>
  <text x="380" y="800" font-size="12" fill="#666666">paint-order="stroke fill"</text>
  <text x="24" y="820" font-size="12" fill="#aa0000">CURRENT: both circles identical (heavy dark ring eats the red fill). EXPECTED: right circle has a thinner outer ring and a full red disc.</text>

  <!-- ============ 5. gradient xlink:href inheritance ============ -->
  <text x="24" y="850" font-size="15" fill="#333333">5. linearGradient xlink:href : derived gradient inherits its stops</text>
  <rect x="40"  y="866" width="240" height="100" fill="url(#gBase)"/>
  <rect x="320" y="866" width="240" height="100" fill="url(#gDerived)"/>
  <rect x="620" y="866" width="240" height="100" fill="url(#gVertical)"/>
  <text x="40"  y="988" font-size="12" fill="#666666">gBase : horizontal (reference)</text>
  <text x="320" y="988" font-size="12" fill="#666666">gDerived : href="#gBase" + vertical</text>
  <text x="620" y="988" font-size="12" fill="#666666">gVertical : vertical (reference)</text>
  <text x="24" y="1008" font-size="12" fill="#aa0000">CURRENT: middle box has NO stops (blank / fallback). EXPECTED: matches the right box.</text>

  <!-- ============ 6. solidColor / overflow ============ -->
  <text x="24" y="1038" font-size="15" fill="#333333">6. solidColor paint server and overflow=visible on nested svg</text>
  <rect x="40" y="1052" width="160" height="90" fill="#00a0ff"/>
  <rect x="48" y="1060" width="144" height="74" fill="url(#sc)"/>
  <text x="40" y="1162" font-size="12" fill="#666666">solidColor 50% green</text>

  <svg x="320" y="1052" width="140" height="70" viewBox="0 0 70 70"
       overflow="visible">
    <circle cx="35" cy="35" r="48" fill="#f39c12"/>
  </svg>
  <rect x="320" y="1052" width="140" height="70" fill="none"
        stroke="#999999" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="320" y="1162" font-size="12" fill="#666666">overflow=visible (dashed = viewport)</text>
  <text x="24" y="1176" font-size="12" fill="#aa0000">CURRENT: left inner box BLACK (default fill), right circle CLIPPED to the dashed box.</text>

</svg>
